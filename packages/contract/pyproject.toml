[project]
name = "confam-contract"
version = "0.0.0"
description = "Generated Pydantic models for the Confam verdict contract"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py/confam_contract"]
