[project]
name = "confam-engine"
version = "0.0.0"
description = "Confam verification engine: rule-based comparison and photo reading (not the legacy engine)"
requires-python = ">=3.12"
dependencies = ["confam-contract", "pydantic>=2", "pillow>=10.1", "pytesseract>=0.3.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["confam_engine"]
