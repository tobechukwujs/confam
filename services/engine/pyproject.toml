[project]
name = "confam-engine"
version = "0.0.0"
description = "Confam verification engine (STUB: only the not_in_record branch exists; the real engine is ported in later)"
requires-python = ">=3.12"
dependencies = ["confam-contract", "pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["confam_engine"]
