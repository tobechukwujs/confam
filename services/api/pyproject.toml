[project]
name = "confam-api"
version = "0.0.0"
description = "Confam public API (text checks and public verdict pages)"
requires-python = ">=3.12"
dependencies = [
    "confam-contract",
    "confam-engine",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["confam_api"]
