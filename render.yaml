# Render blueprint for the Confam API. Prepared, NOT deployed: create the service
# from this file in the Render dashboard when you are ready.
# UNVERIFIED on Render: check the first build log (uv install, Python version).
services:
  - type: web
    name: confam-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install uv && uv sync --frozen --no-dev --package confam-api
    startCommand: uv run --no-sync --package confam-api uvicorn --app-dir services/api main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Set to your Vercel URL(s), comma separated, e.g. https://confam-web.vercel.app
      - key: CONFAM_CORS_ORIGINS
        sync: false
      # "1" serves the fictional sample verdicts at /v/<code>. Fine for a labelled demo;
      # turn off once real notices are in the record.
      - key: CONFAM_SEED_SAMPLES
        value: "1"
      - key: CONFAM_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: CONFAM_IP_SALT
        generateValue: true
