[project]
name = "confam"
version = "0.0.0"
description = "Confam workspace root"
requires-python = ">=3.12"
dependencies = ["confam-contract", "confam-engine"]

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "datamodel-code-generator>=0.26",
]

[tool.uv.workspace]
members = ["packages/contract", "services/engine"]

[tool.uv.sources]
confam-contract = { workspace = true }
confam-engine = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/contract/tests", "services/engine/tests"]
addopts = "-ra"
